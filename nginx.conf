server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS so upstream names resolve at request time.
    # This lets nginx boot even if the behavioral backend (api) isn't running,
    # returning 502 on those routes instead of failing to start.
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Common proxy headers (incl. WebSocket upgrade for the chat sockets).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Behavioral backend (FastAPI mounted at /api/v1) — CV, DISC/5D, questions.
    # Longest-prefix match means this wins over /api/ for /api/v1/* requests.
    location /api/v1/ {
        set $disc_upstream http://api:8000;
        proxy_pass $disc_upstream$request_uri;
    }

    # Demo backend — auth, mentorship, billing, conversations, messages (+ WS).
    location /api/ {
        set $demo_upstream http://demo-api:8081;
        proxy_pass $demo_upstream$request_uri;
    }

    # SPA client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
